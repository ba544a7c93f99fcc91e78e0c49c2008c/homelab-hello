app-template:
  route:
    internal:
      parentRefs:
        - name: internal
          namespace: istio-ingress
          sectionName: https
      hostnames:
        - hello.apps.int.dvop.cc
      rules:
        - backendRefs:
            - identifier: main
              port: 8080
    # Nom public (Cloudflare Tunnel → Gateway public, Access devant) : déclaré
    # dans homelab-iac k8s/projects/hello/apps.yaml (access: cloudflare).
    public:
      parentRefs:
        - name: public
          namespace: istio-ingress
          sectionName: http
      hostnames:
        - hello.dvop.cc
      rules:
        - backendRefs:
            - identifier: main
              port: 8080
