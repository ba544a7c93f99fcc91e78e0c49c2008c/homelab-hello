app-template:
  controllers:
    hello:
      replicas: 1
      pod:
        automountServiceAccountToken: false
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          seccompProfile:
            type: RuntimeDefault
      containers:
        main:
          image:
            repository: hashicorp/http-echo
            tag: 1.0.0
            digest: sha256:fcb75f691c8b0414d670ae570240cbf95502cc18a9ba57e982ecac589760a186
          args:
            - -listen=:8080
            - -text=$(GREETING)
          env:
            GREETING:
              valueFrom:
                secretKeyRef:
                  name: hello-greeting
                  key: message
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
  service:
    main:
      controller: hello
      type: ClusterIP
      ports:
        http:
          port: 8080
