apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hello-greeting
spec:
  secretStoreRef:
    name: openbao
    kind: SecretStore
  refreshInterval: 1h
  target:
    name: hello-greeting
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
    - secretKey: message
      remoteRef:
        key: hello/greeting
        property: message
