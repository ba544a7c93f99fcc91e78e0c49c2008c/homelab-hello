app-template:
  # 2 réplicas sur 2 nœuds : perdre un nœud apps ne coupe plus hello
  # (réplica unique = ~5 min d attente d éviction). Lab mono-nœud : 1 réplica.
  controllers:
    hello:
      replicas: 2
      pod:
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                app.kubernetes.io/controller: hello
  route:
    internal:
      parentRefs:
        - name: internal
          namespace: istio-ingress
          sectionName: https
      hostnames:
        - hello.apps.int.dvop.cc
      rules:
        - backendRefs:
            - identifier: main
              port: 8080
    # Nom public (Cloudflare Tunnel → Gateway public, Access devant) : déclaré
    # dans homelab-iac k8s/projects/hello/apps.yaml (access: cloudflare).
    public:
      parentRefs:
        - name: public
          namespace: istio-ingress
          sectionName: http
      hostnames:
        - hello.dvop.cc
      rules:
        - backendRefs:
            - identifier: main
              port: 8080
