app-template:
  # Test de bout en bout du stockage Garage : écrit/relit un objet en S3 (clé rw)
  # et via le montage du bucket (PVC s3-smoke, csi-s3). SA s3-smoke = writers.
  serviceAccount:
    s3-smoke:
      enabled: true
      forceRename: s3-smoke
  persistence:
    smoke:
      type: persistentVolumeClaim
      existingClaim: s3-smoke
      advancedMounts:
        s3smoke3:
          main:
            - path: /mnt/smoke
    # Racine step-ca de la plateforme (ConfigMap posé par la baseline) : rclone
    # (Go) la lit via SSL_CERT_FILE quand l endpoint S3 passe en https.
    platform-ca:
      type: configMap
      name: platform-ca
      advancedMounts:
        s3smoke3:
          main:
            - path: /etc/platform-ca
              readOnly: true
    tmp:
      type: emptyDir
      advancedMounts:
        s3smoke3:
          main:
            - path: /tmp
  # 2 réplicas sur 2 nœuds : perdre un nœud apps ne coupe plus hello
  # (réplica unique = ~5 min d attente d éviction). Lab mono-nœud : 1 réplica.
  controllers:
    s3smoke3:
      type: job
      job:
        backoffLimit: 3
      serviceAccount:
        identifier: s3-smoke
      pod:
        restartPolicy: Never
      containers:
        main:
          image:
            repository: rclone/rclone
            tag: 1.76.0
            digest: sha256:7cbeec24a44f206067597c0368be4de90ae19a64d5113c7d1938bd737a81e466
          command: [sh, -c]
          args:
            - |
              set -eu
              echo "endpoint scheme: ${RCLONE_CONFIG_GARAGE_ENDPOINT%%://*}"
              echo "s3 $(date -u +%FT%TZ)" > /tmp/s3.txt
              rclone copyto /tmp/s3.txt "garage:$BUCKET/smoke/s3.txt"
              rclone cat "garage:$BUCKET/smoke/s3.txt"
              echo "mount $(date -u +%FT%TZ)" > /mnt/smoke/mount.txt
              sleep 5
              rclone cat "garage:$BUCKET/mount.txt"
              ls -l /mnt/smoke /mnt/smoke/smoke
              echo SMOKE-OK
          env:
            HOME: /tmp
            # Remplace le magasin par défaut pour ce processus : seule la racine
            # plateforme est approuvée (aucun endpoint public visé). Sans effet en http.
            SSL_CERT_FILE: /etc/platform-ca/ca.crt
            RCLONE_CONFIG_GARAGE_TYPE: s3
            RCLONE_CONFIG_GARAGE_PROVIDER: Other
            RCLONE_CONFIG_GARAGE_FORCE_PATH_STYLE: "true"
            RCLONE_CONFIG_GARAGE_ENDPOINT:
              valueFrom: {secretKeyRef: {name: garage-s3-smoke-rw, key: endpoint}}
            RCLONE_CONFIG_GARAGE_REGION:
              valueFrom: {secretKeyRef: {name: garage-s3-smoke-rw, key: region}}
            RCLONE_CONFIG_GARAGE_ACCESS_KEY_ID:
              valueFrom: {secretKeyRef: {name: garage-s3-smoke-rw, key: access_key_id}}
            RCLONE_CONFIG_GARAGE_SECRET_ACCESS_KEY:
              valueFrom: {secretKeyRef: {name: garage-s3-smoke-rw, key: secret_access_key}}
            BUCKET:
              valueFrom: {secretKeyRef: {name: garage-s3-smoke-rw, key: bucket}}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
    hello:
      replicas: 2
      pod:
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                app.kubernetes.io/controller: hello
  route:
    internal:
      parentRefs:
        - name: internal
          namespace: istio-ingress
          sectionName: https
      hostnames:
        - hello.apps.int.dvop.cc
      rules:
        - backendRefs:
            - identifier: main
              port: 8080
    # Nom public (Cloudflare Tunnel → Gateway public, Access devant) : déclaré
    # dans homelab-iac k8s/projects/hello/apps.yaml (access: cloudflare).
    public:
      parentRefs:
        - name: public
          namespace: istio-ingress
          sectionName: http
      hostnames:
        - hello.dvop.cc
      rules:
        - backendRefs:
            - identifier: main
              port: 8080
